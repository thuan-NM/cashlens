# CashLens single-host release stack (OPS-006, OPS-009).
#
# Every setting comes from an env file that is never committed:
#   docker compose --env-file <env> -f docker-compose.prod.yml run --rm migrate
#   docker compose --env-file <env> -f docker-compose.prod.yml up -d
# Release verification uses the git-ignored .env.release-test generated by
#   ./scripts/init-local-env.ps1 -Profile release-test -PublicOrigin https://<host>
# Real deployments keep their env file outside the repository.
#
# TLS is terminated by the operator's reverse proxy on ONE public origin: it
# routes /api/ to 127.0.0.1:${API_HOST_PORT} and / to 127.0.0.1:${WEB_HOST_PORT}.
# Only one stack using this file may run on a host at a time (pinned subnet).
name: cashlens-prod

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: "3000"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
  JWT_REFRESH_EXPIRES_IN_DAYS: ${JWT_REFRESH_EXPIRES_IN_DAYS:-30}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
  CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
  # Starting value only; release verification (T100) checks that it covers the
  # peer address the API actually observes behind the proxy.
  TRUST_PROXY: ${TRUST_PROXY:-loopback,172.28.0.1}
  EMAIL_TOKEN_ENCRYPTION_KEY: ${EMAIL_TOKEN_ENCRYPTION_KEY:?EMAIL_TOKEN_ENCRYPTION_KEY is required}
  GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:?GMAIL_CLIENT_ID is required}
  GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:?GMAIL_CLIENT_SECRET is required}
  GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:?GMAIL_REDIRECT_URI is required}
  GMAIL_OAUTH_STATE_SECRET: ${GMAIL_OAUTH_STATE_SECRET:?GMAIL_OAUTH_STATE_SECRET is required}
  EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-disabled}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_SECURE: ${SMTP_SECURE:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  EMAIL_ATTEMPT_TIMEOUT_MS: ${EMAIL_ATTEMPT_TIMEOUT_MS:-5000}
  EMAIL_TOTAL_BUDGET_MS: ${EMAIL_TOTAL_BUDGET_MS:-12000}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    # Not published: only services on cashlens_net can reach the database.
    volumes:
      - cashlens_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - cashlens_net

  # One-off migration runner (OPS-003): `run --rm migrate`, or started
  # automatically before `api`. The runtime image carries no Prisma CLI.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: tools
    image: cashlens-api-tools:release
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cashlens_net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: cashlens-api:release
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - cashlens_net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Same-origin routing: always relative, never an absolute API origin.
        VITE_API_BASE_URL: /api
    image: cashlens-web:release
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - cashlens_net

networks:
  cashlens_net:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

volumes:
  cashlens_prod_postgres_data:
