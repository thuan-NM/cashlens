# Development stack only (NODE_ENV=development). Every secret below is a
# documented placeholder default that production startup rejects (CFG-001);
# override any of them from the shell or with `--env-file`. The release stack
# is docker-compose.prod.yml.
services:
  postgres:
    image: postgres:16-alpine
    container_name: cashlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cashlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cashlens_password}
      POSTGRES_DB: ${POSTGRES_DB:-cashlens_db}
    ports:
      # Override POSTGRES_HOST_PORT when another local PostgreSQL already uses 5432.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - cashlens_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: node:22-alpine
    container_name: cashlens-api
    working_dir: /workspace
    restart: unless-stopped
    # tini as PID 1 forwards SIGTERM so `docker compose stop` runs Nest shutdown hooks.
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-cashlens}:${POSTGRES_PASSWORD:-cashlens_password}@postgres:5432/${POSTGRES_DB:-cashlens_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-random-jwt-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN_DAYS: ${JWT_REFRESH_EXPIRES_IN_DAYS:-30}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      TRUST_PROXY: ${TRUST_PROXY:-loopback}
      EMAIL_TOKEN_ENCRYPTION_KEY: ${EMAIL_TOKEN_ENCRYPTION_KEY:-replace-with-at-least-32-random-characters}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-http://localhost:3000/api/email-connections/gmail/callback}
      GMAIL_OAUTH_STATE_SECRET: ${GMAIL_OAUTH_STATE_SECRET:-replace-with-a-random-oauth-state-secret}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-disabled}
    ports:
      # Override API_HOST_PORT (and VITE_API_BASE_URL) when 3000 is already taken.
      - "${API_HOST_PORT:-3000}:3000"
    volumes:
      - .:/workspace
      - cashlens_root_node_modules:/workspace/node_modules
      - cashlens_api_node_modules:/workspace/apps/api/node_modules
      - cashlens_web_node_modules:/workspace/apps/web/node_modules
    # Migrations fail closed: each step is chained with &&, so a failed
    # `prisma migrate deploy` stops the chain before the API starts, and the
    # readiness check below never passes (OPS-003).
    command: >
      sh -c "corepack enable &&
      yarn install --immutable &&
      yarn workspace api prisma migrate deploy &&
      yarn workspace api prisma generate &&
      exec yarn workspace api start:dev"
    healthcheck:
      # Ready only when the API answers and PostgreSQL is usable (OPS-004).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      # The first start installs dependencies into the named volumes.
      start_period: 15m

  web:
    image: node:22-alpine
    container_name: cashlens-web
    working_dir: /workspace
    restart: unless-stopped
    init: true
    # Waiting for a healthy API also serializes the shared node_modules installs.
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api}
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - cashlens_root_node_modules:/workspace/node_modules
      - cashlens_api_node_modules:/workspace/apps/api/node_modules
      - cashlens_web_node_modules:/workspace/apps/web/node_modules
    command: >
      sh -c "corepack enable &&
      yarn install --immutable &&
      exec yarn workspace web dev --host 0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5m

volumes:
  cashlens_postgres_data:
  cashlens_root_node_modules:
  cashlens_api_node_modules:
  cashlens_web_node_modules:
