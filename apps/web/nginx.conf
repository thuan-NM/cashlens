# Static web server for the CashLens release image. TLS and /api/ routing are
# handled by the operator's reverse proxy in front of the host (OPS-009).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Fingerprinted build assets can be cached for a long time.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Single-page app fallback; index.html must never be cached so new
  # releases take effect immediately.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
