openapi: 3.1.0
info:
  title: CashLens Operational MVP contract delta
  version: 0.2.0
  description: >-
    Design contract for production-readiness changes. Existing documented routes remain;
    implementation must merge these additions into generated Swagger.

    Envelope rule: every 2xx response body is the existing global BaseResponseDto envelope
    produced by the APP_INTERCEPTOR-registered BaseResponseInterceptor:
    {success, data, message, timestamp} (+ additive correlationId from T064/P2.1).
    Payload schemas below describe only `data`; each 2xx response composes them with `Envelope`
    via allOf. Error responses are not enveloped (Nest exception shape + additive code/correlationId/fields).

    Compatibility rule: existing field names and enum values are retained; new fields are additive.
    Intentional changes are listed in plan.md "API Compatibility".

    Deployment rule (OPS-009): in production the web app and this API share one public origin;
    the proxy routes /api/ to the API and / to the web app, and the web app calls this API by the relative path /api.

    Authorization rule (SEC-005, US1 closure): 401 for a missing, invalid, or inactive-account session; on
    administrator-only operations authorization precedes body validation, so a non-administrator gets 403 whatever
    fields a well-formed JSON body contains; owner-scoped operations answer absent, not-owned, and malformed ids with
    the same 404. Operations that do not exist (for example bank-provider writes) are unsupported routes (404).
    Three request-level refusals happen before authentication and apply to every caller, signed in or not: a URL
    containing an encoded NUL (%00) gets 404; a path parameter with undecodable percent-encoding (for example %FF)
    gets 400; a body that is not valid JSON gets 400. None of them discloses whether a resource exists.
servers:
  - url: /api
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
  schemas:
    Envelope:
      description: Existing BaseResponseDto shape (apps/api/src/common/dto/base-response.dto.ts).
      type: object
      required: [success, data, message, timestamp]
      properties:
        success: { type: boolean, const: true }
        data: {}
        message: { type: string, example: Success }
        timestamp: { type: string, format: date-time }
        correlationId: { type: string, description: Additive (T064); absent before P2.1 lands }
    Error:
      description: Nest exception shape retained; code/correlationId/fields added by the global safe exception filter (T064).
      type: object
      required: [statusCode, message]
      properties:
        statusCode: { type: integer }
        message: { oneOf: [{type: string}, {type: array, items: {type: string}}] }
        error: { type: string, description: Existing Nest reason phrase }
        code: { type: string }
        correlationId: { type: string }
        fields: { type: object, additionalProperties: {type: array, items: {type: string}} }

    EmailSyncRun:
      description: >-
        Existing EmailSyncRun response (toEmailSyncRunResponse) with existing field names and
        status values. emailsFailed, hasMore, and EXPIRED are additive (DB-M1). As built (T044): exactly
        these fields are returned; the lease token and the opaque provider cursors (cursorBefore/cursorAfter)
        stay internal. SUCCESS = every handled message succeeded (a budget stop is still SUCCESS with
        hasMore); PARTIAL_FAILED = at least one message failed (a parser failure or a provider failure) or
        the page was cut by a transient provider failure after some progress; FAILED = nothing could be
        handled (listing failed, or refused access or a transient failure before the first message);
        EXPIRED = the run lost its lease before finishing (recorded by the next lease holder or by its own
        finish). errorMessage is one of a fixed set of sanitized strings (for example "2 message(s) failed",
        "Gmail is temporarily unavailable; sync again later").
      type: object
      required: [id, emailConnectionId, triggerType, status, startedAt, emailsFound, emailsMatched, emailsParsed, transactionsCreated, emailsFailed, hasMore]
      properties:
        id: { type: string }
        emailConnectionId: { type: string }
        triggerType: { enum: [MANUAL, SCHEDULED, WEBHOOK, BACKFILL] }
        status: { enum: [RUNNING, SUCCESS, PARTIAL_FAILED, FAILED, EXPIRED] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        emailsFound: { type: integer, minimum: 0 }
        emailsMatched: { type: integer, minimum: 0 }
        emailsParsed: { type: integer, minimum: 0 }
        transactionsCreated: { type: integer, minimum: 0 }
        emailsFailed: { type: integer, minimum: 0, description: Additive }
        hasMore: { type: boolean, description: 'Additive; true when a non-FAILED run left work in the current window (a next page, a run-budget stop, or a transient cut); the next manual sync continues it. Always false for FAILED and EXPIRED.' }
        errorMessage: { type: [string, 'null'], description: Sanitized failure summary (existing field) }

    EmailConnectionView:
      description: >-
        Existing connection fields (id, provider, emailAddress, providerUserId, tokenExpiresAt, scopes, status,
        lastSyncedAt, connectedAt, disconnectedAt, errorMessage, createdAt, updatedAt) plus additive recovery and
        progress fields (T041). Credentials, the provider cursor, and the lease token are never returned.
      type: object
      properties:
        status: { enum: [ACTIVE, EXPIRED, REVOKED, ERROR], description: 'EXPIRED = the provider refused the grant (reconnect required); REVOKED = the user disconnected; ERROR = the last sync failed for a temporary reason' }
        reconnectRequired: { type: boolean, description: Additive; true exactly when recoveryAction is RECONNECT }
        recoveryAction: { enum: [NONE, RETRY, RECONNECT, CONNECT], description: 'Additive (EMAIL-003): RETRY = sync again; RECONNECT = new consent flow; CONNECT = disconnected' }
        lastFailedAt: { type: [string, 'null'], format: date-time, description: Additive; last failed sync attempt }
        backfillFrom: { type: [string, 'null'], format: date-time, description: Additive; initial import boundary fixed at the first sync }
        backfillCompletedAt: { type: [string, 'null'], format: date-time, description: Additive; when the initial window was fully read }
        syncInProgress: { type: boolean, description: Additive; an unexpired sync lease exists }

    ParseOutcome:
      description: >-
        POST /email-messages/{id}/parse result (as built, T045). Either a transaction outcome or a sanitized failure.
        A message already linked to a transaction returns created false. A certain repeat (the same bank
        transaction code with the same amount, direction, and currency) returns the existing transaction with
        duplicate true and creates nothing. Any other match creates a row flagged as a suspected duplicate
        (isDuplicate, excluded from totals until cleared) and returns suspectedDuplicate true (EMAIL-008).
      oneOf:
        - type: object
          required: [transactionId, created]
          properties:
            transactionId: { type: string }
            created: { type: boolean }
            duplicate: { type: boolean, const: true, description: Present only for a certain cross-message duplicate }
            suspectedDuplicate: { type: boolean, const: true, description: Present only when a flagged suspected duplicate was created }
        - type: object
          required: [parserRun, created]
          properties:
            created: { const: false }
            parserRun: { $ref: '#/components/schemas/ParserRun' }

    ParserRun:
      description: >-
        Sanitized parse attempt (EMAIL-010, EMAIL-011). errorMessage is a code with field names only, for example
        "INVALID_AMOUNT: amount", "MISSING_REQUIRED_FIELDS: amount, transaction_time", "AMBIGUOUS_VALUE: amount",
        "AMBIGUOUS_DIRECTION: direction", "NO_TEMPLATE_MATCHED".
        extractedPayload holds per-field match status only (MATCHED, FALLBACK, MISSING), never captured text.
        normalizedPayload holds the deduplication decision only: { deduplication: { strategy, outcome: CREATED |
        DUPLICATE | SUSPECTED_DUPLICATE, duplicateOfTransactionId?, sameFacts? } }. Legacy rows written before T045
        may still hold captured values.
      type: object
      properties:
        id: { type: string }
        emailMessageId: { type: string }
        parserTemplateId: { type: [string, 'null'] }
        status: { enum: [SUCCESS, FAILED, PARTIAL] }
        confidenceScore: { type: [number, 'null'] }
        extractedPayload: { type: object }
        normalizedPayload: { type: object }
        errorMessage: { type: [string, 'null'] }
        createdTransactionId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    GoalFeasibility:
      description: >-
        Existing simulation response fields retained (the web reads monthlyRequired and feasibilityScore).
        Status values change intentionally; feasibilityScore is null for INSUFFICIENT_DATA.
      type: object
      required: [goalId, months, horizonSource, pastDeadline, targetAmount, savedAmount, remainingAmount, monthlyRequired, feasibilityScore, status, observationMonths]
      properties:
        goalId: { type: string }
        scenario: { enum: [FULL, INSTALLMENT], description: 'Retained; INSTALLMENT handling pending product decision (no inferred interest rate may be applied, GOAL-007)' }
        months: { type: integer, minimum: 0, description: 'Remaining periods used as divisor: user months from current through deadline month inclusive; 0 when past deadline (data-model GOAL rules)' }
        horizonSource: { enum: [QUERY, TARGET_DATE, GOAL_MONTHS, DEFAULT], description: 'Additive; which horizon determined the deadline month (DEFAULT = visible 6-month default)' }
        pastDeadline: { type: boolean, description: 'Additive; true when months = 0 and remainingAmount > 0 (whole remaining amount due now, unrounded)' }
        targetAmount: { type: number }
        savedAmount: { type: number }
        remainingAmount: { type: number, minimum: 0 }
        totalCost: { type: number, description: Retained; equals remainingAmount unless an approved scenario rule exists }
        monthlyRequired: { type: number, minimum: 0, description: 'Required monthly saving (GOAL-002): ceil(remainingAmount / months) to the currency unit (whole VND); remainingAmount when pastDeadline; 0 when remainingAmount = 0' }
        feasibilityScore: { type: [integer, 'null'], minimum: 0, maximum: 100, description: 'floor(available * 100 / monthlyRequired) capped 0-100; 100 when monthlyRequired = 0; null when INSUFFICIENT_DATA' }
        status: { enum: [SAFE, ACCEPTABLE, RISKY, NOT_RECOMMENDED, INSUFFICIENT_DATA] }
        availableMonthlyCashflow: { type: [number, 'null'], description: 'Additive; floor of mean completed-month net cashflow in the goal currency (GOAL-003); null when INSUFFICIENT_DATA' }
        observationMonths: { type: array, items: {type: string, pattern: '^\d{4}-\d{2}$'}, description: Additive }
        monthsRequired: { type: integer, minimum: 0, description: 'Additive; additional completed months needed when INSUFFICIENT_DATA (2 minus the observed count); 0 otherwise' }
        reason: { type: string, description: 'Additive; sanitized explanation as comma-separated codes, in this order: INSUFFICIENT_HISTORY, TARGET_REACHED, PAST_DEADLINE (COMPLETED_MONTHS_AVERAGE alone when none applies), then INSTALLMENT_WITHOUT_INTEREST for the INSTALLMENT scenario' }

    BudgetWrite:
      description: Threshold fields of budget create/update (other existing fields unchanged). All existing period values remain accepted; only MONTHLY budgets are evaluated for alerts (BUDGET-005).
      type: object
      properties:
        thresholdPercent:
          type: integer
          minimum: 1
          maximum: 99
          default: 80
          description: Warning threshold percent. Critical is fixed at 100 and not writable. Values >= 100 are rejected with 400 (intentional tightening from 1-200).
    BudgetThresholdView:
      description: Additive fields on existing budget responses.
      type: object
      properties:
        thresholdPercent: { type: integer, description: Stored value; legacy rows may hold 100-200 }
        warningThresholdActive: { type: boolean, description: false when stored thresholdPercent >= 100 (legacy) }
        criticalThresholdPercent: { type: integer, const: 100 }
        alertsSupported: { type: boolean, description: 'Additive (BUDGET-005); true only for period = MONTHLY' }
        usageBasis: { enum: [PERIOD_INSTANCE, CALENDAR_MONTH_APPROXIMATION], description: 'Additive; MONTHLY budgets use the user-month period instance; other period types keep the existing calendar-month projection' }

    Alert:
      description: Existing alert fields plus DB-M4 lifecycle; read state (isRead/readAt) is independent of status.
      type: object
      required: [id, type, severity, title, message, isRead, status, triggeredAt, createdAt]
      properties:
        id: { type: string }
        type: { enum: [BUDGET_THRESHOLD, LARGE_TRANSACTION, CATEGORY_SHIFT, GOAL_RISK, CASHFLOW_RISK, PARSER_ISSUE, SYSTEM] }
        severity: { enum: [INFO, WARNING, CRITICAL] }
        title: { type: string }
        message: { type: string }
        resourceType: { type: [string, 'null'] }
        resourceId: { type: [string, 'null'] }
        isRead: { type: boolean }
        readAt: { type: [string, 'null'], format: date-time }
        status: { enum: [ACTIVE, DISMISSED, RESOLVED] }
        conditionKey: { type: [string, 'null'], description: null for legacy and user-authored alerts }
        thresholdValue: { type: [number, 'null'] }
        observedValue: { type: [number, 'null'] }
        periodStart: { type: [string, 'null'], format: date-time }
        periodEnd: { type: [string, 'null'], format: date-time }
        triggeredAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolutionReason: { type: [string, 'null'] }
        dismissedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        emailDelivery: { oneOf: [{ $ref: '#/components/schemas/AlertDelivery' }, { type: 'null' }], description: 'null for legacy and user-authored alerts (no delivery row)' }
    AlertDelivery:
      type: object
      required: [channel, status, attemptCount]
      properties:
        channel: { enum: [EMAIL] }
        status: { enum: [PENDING, SENT, SKIPPED, FAILED] }
        skipReason: { type: [string, 'null'], enum: [NOT_CRITICAL, EMAIL_DISABLED, NOTIFICATIONS_DISABLED, TRANSPORT_DISABLED, null] }
        attemptCount: { type: integer, minimum: 0, maximum: 3 }
        lastAttemptAt: { type: [string, 'null'], format: date-time }
        sentAt: { type: [string, 'null'], format: date-time }
        failureCode: { type: [string, 'null'], description: 'e.g. TIMEOUT, AUTH, REJECTED, INTERRUPTED' }
    AlertSetting:
      description: Existing per-type setting; emailEnabled default becomes false for every type.
      type: object
      required: [type, inAppEnabled, emailEnabled]
      properties:
        type: { enum: [BUDGET_THRESHOLD, LARGE_TRANSACTION, CATEGORY_SHIFT, GOAL_RISK, CASHFLOW_RISK, PARSER_ISSUE, SYSTEM] }
        inAppEnabled: { type: boolean, default: true }
        emailEnabled: { type: boolean, default: false }
        threshold: { type: [number, 'null'], exclusiveMinimum: 0, description: 'LARGE_TRANSACTION amount in user base currency; null = default 5,000,000 when base currency is VND, otherwise inactive' }
        emailAvailable: { type: boolean, description: Additive; false when EMAIL_TRANSPORT=disabled }

    UserSettingsWrite:
      description: Relevant field of existing PATCH /users/me/settings (other existing fields unchanged).
      type: object
      properties:
        storeRawEmailBody: { type: boolean, const: false, description: 'DATA-001; true is rejected with 400 code RAW_EMAIL_BODY_UNAVAILABLE' }
    UserSettingsView:
      description: Additive field on existing settings responses.
      type: object
      properties:
        storeRawEmailBody: { type: boolean, description: 'Stored value; legacy true is preserved but has no effect' }
        rawEmailBodyAvailable: { type: boolean, const: false, description: 'Additive; raw body retention is unavailable in this release' }

    AdminUserWrite:
      description: >-
        Admin-only account fields (existing CreateUserDto/UpdateUserDto). Create requires email; create and update
        accept fullName, role, status, timezone, locale, baseCurrency, and metadata. metadata is write-only: it is never
        returned in AdminUserView. Authorization precedes body validation: a non-administrator gets 403 whatever fields
        a well-formed JSON body contains; field-level 400 applies only to an authorized administrator. Setting a status
        other than ACTIVE, or deleting the account, revokes its refresh tokens. Every change is audited with field names
        only (SEC-006).
      type: object
      properties:
        email: { type: string, format: email, description: Create only (required there) }
        fullName: { type: string }
        role: { enum: [USER, ADMIN] }
        status: { enum: [ACTIVE, DISABLED, PENDING_DELETE] }
        timezone: { type: string }
        locale: { type: string }
        baseCurrency: { type: string }
        metadata: { type: object, writeOnly: true }
    AdminUserView:
      description: >-
        What an administrator sees of an account (SEC-008): identity and status only. The user's settings, metadata,
        credentials, and financial or email data are never included; the settings key is absent.
      type: object
      required: [id, email, role, status]
      properties:
        id: { type: string }
        email: { type: string }
        fullName: { type: [string, 'null'] }
        role: { enum: [USER, ADMIN] }
        status: { enum: [ACTIVE, DISABLED, PENDING_DELETE] }
        timezone: { type: string }
        locale: { type: string }
        baseCurrency: { type: string }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserProfileWrite:
      description: >-
        Self-service profile update (PATCH /users/me), added when /users/{id} became administrator-only. Only these
        fields are accepted; role, status, email, id, userId, deletedAt, or metadata get 400 (SEC-004).
      type: object
      properties:
        fullName: { type: string, maxLength: 120 }
        timezone: { type: string, maxLength: 64, description: 'IANA time zone (DASH-002); an unknown zone gets 400. Registration and the admin user bodies use the same rule' }
        locale: { type: string, maxLength: 16 }
        baseCurrency: { type: string, pattern: '^[A-Z]{3}$', description: 'Upper-case ISO 4217 code; registration and the admin user bodies use the same rule' }
    TransactionWriteRules:
      description: >-
        Rules for the existing transaction create/update bodies (SEC-004, TX-002). userId, classificationSource,
        classificationConfidence, classificationRuleId, and classifiedAt are not accepted (400); provenance is derived
        on the server. A categoryId on create, or on PATCH (a category or null), is a MANUAL decision locked against
        automatic classification and recorded as a category event (T054); without one, create applies the rules
        (T055) and PATCH leaves the classification unchanged. status accepts PENDING, POSTED, IGNORED, or NEEDS_REVIEW, never DELETED: deletion uses
        DELETE /transactions/{id}, an audited soft delete. Related ids (financialAccountId, categoryId,
        duplicateOfTransactionId) must be non-empty and owned (or a system category), otherwise 400 or owner-safe 404;
        an archived account or category gets the same 404. isDuplicate true needs a duplicateOfTransactionId (sent or
        already stored); a reference alone marks the record as a duplicate; isDuplicate false clears the reference and
        cannot be sent together with one; a transaction cannot reference itself. Every refusal is a 400 whose message
        names the field (T034).
      type: object
      properties:
        status: { enum: [PENDING, POSTED, IGNORED, NEEDS_REVIEW] }
        amount: { type: number, exclusiveMinimum: 0, maximum: 9999999999999.99, multipleOf: 0.01, description: 'Always positive; the direction carries the sign' }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: 'Upper-case ISO 4217 code' }
        transactionTime: { type: string, format: date-time, description: 'ISO 8601 date-time with a UTC offset or Z; a time without an offset gets 400. It decides the user month (data-model.md "Financial period policy")' }
        postedDate: { type: string, format: date-time, description: Same rule as transactionTime }
        feeAmount: { type: number, minimum: 0, multipleOf: 0.01 }

    ClassificationProvenance:
      description: >-
        Additive transaction fields (T050): who decided the current category. classificationSource is MANUAL
        (locked), USER_RULE, SYSTEM_RULE, FALLBACK (no rule matched; categoryId null, the item needs a category),
        or UNKNOWN (automatic classification off, or a legacy row). The legacy enum values RULE, ML, LLM, and SYSTEM
        are never written (CLASS-007).
      type: object
      properties:
        classificationSource: { enum: [MANUAL, USER_RULE, SYSTEM_RULE, FALLBACK, UNKNOWN] }
        classificationRuleId: { type: [string, 'null'], description: 'Winning rule; null for MANUAL, FALLBACK, UNKNOWN, or a deleted rule' }
        classificationConfidence: { type: [number, 'null'], description: 1 when a category is set by the owner or a rule; null otherwise }
        classifiedAt: { type: [string, 'null'], format: date-time }
    DecisionExplanation:
      description: >-
        Why the winner won (CLASS-003): every matching eligible rule in rank order (user before system, then
        priority descending, createdAt ascending, id ascending), the tie-break between the winner and the runner-up,
        and whether the matches pointed to more than one category. Ids and codes only, never text (SEC-006).
      type: object
      required: [candidates, winnerRuleId, runnerUpRuleId, tieBreak, conflict]
      properties:
        candidates:
          type: array
          items:
            type: object
            required: [ruleId, scope, priority, createdAt, categoryId]
            properties:
              ruleId: { type: string }
              scope: { enum: [USER, SYSTEM] }
              priority: { type: integer }
              createdAt: { type: string, format: date-time }
              categoryId: { type: string }
        winnerRuleId: { type: [string, 'null'] }
        runnerUpRuleId: { type: [string, 'null'] }
        tieBreak: { enum: [SCOPE, PRIORITY, CREATED_AT, ID, null] }
        conflict: { type: boolean }
    CategoryEvent:
      description: One append-only category history event (CLASS-005), oldest first by sequence.
      type: object
      required: [id, sequence, createdAt, source, trigger, reason, actorType, actorUserId, merchantRuleId, previousCategory, newCategory, explanation]
      properties:
        id: { type: string }
        sequence: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        source: { enum: [MANUAL, USER_RULE, SYSTEM_RULE, FALLBACK] }
        trigger: { enum: [CREATE, IMPORT, MANUAL_CORRECTION, EXPLICIT_RECLASSIFY, AUTOMATIC_RERUN] }
        reason: { enum: [MANUAL_SET, MANUAL_CLEARED, RULE_MATCHED, NO_RULE_MATCHED] }
        actorType: { enum: [USER, SYSTEM] }
        actorUserId: { type: [string, 'null'] }
        merchantRuleId: { type: [string, 'null'], description: Kept after the rule is deleted }
        previousCategory:
          oneOf:
            - { type: 'null' }
            - { type: object, properties: { id: { type: string }, name: { type: [string, 'null'], description: 'Null when the owner can no longer read the category' } } }
        newCategory: { $ref: '#/components/schemas/CategoryEvent/properties/previousCategory' }
        explanation: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/DecisionExplanation' }] }
    ClassificationRule:
      description: >-
        A classification rule (CLASS-001). scope USER rules are the caller's own; scope SYSTEM rules are listed
        read-only and have no owner in the response. Matching compares text without diacritics, case, or extra
        spaces: merchantPattern and descriptionPattern are contains-matches (merchant falls back to the
        counterparty), bankName is an equality match, direction an equality match when set; every set criterion
        must hold.
      type: object
      properties:
        id: { type: string }
        scope: { enum: [USER, SYSTEM] }
        categoryId: { type: [string, 'null'] }
        merchantPattern: { type: [string, 'null'] }
        descriptionPattern: { type: [string, 'null'] }
        bankName: { type: [string, 'null'] }
        direction: { enum: [INCOME, EXPENSE, TRANSFER_IN, TRANSFER_OUT, ADJUSTMENT, null] }
        priority: { type: integer, minimum: 0, maximum: 1000000 }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ClassificationRuleWrite:
      description: >-
        Create (categoryId required) or partial update. At least one of merchantPattern, descriptionPattern, or
        bankName must remain set (400). Patterns are literal text of 1-200 characters (never regexes) and may be
        cleared with null on update; categoryId, priority, and isActive may be omitted but not null. The category
        must be an ACTIVE system category or one of the caller's ACTIVE categories, otherwise 404. userId, scope,
        and unknown fields get 400 (SEC-004). Changing a rule never reclassifies existing transactions.
      type: object
      properties:
        categoryId: { type: string }
        merchantPattern: { type: [string, 'null'], maxLength: 200 }
        descriptionPattern: { type: [string, 'null'], maxLength: 200 }
        bankName: { type: [string, 'null'], maxLength: 200 }
        direction: { enum: [INCOME, EXPENSE, TRANSFER_IN, TRANSFER_OUT, ADJUSTMENT, null] }
        priority: { type: integer, minimum: 0, maximum: 1000000, default: 100 }
        isActive: { type: boolean, default: true }

    CurrencyTotals:
      description: Eligible totals of one currency (data-model.md "Financial period policy"); money is never summed across currencies.
      type: object
      required: [currency, income, expense, netCashflow, transactionCount]
      properties:
        currency: { type: string }
        income: { type: number }
        expense: { type: number }
        netCashflow: { type: number }
        transactionCount: { type: integer, description: Eligible records of every direction, transfers and adjustments included }
    TotalsSummary:
      description: >-
        Base-currency totals plus every currency group. income, expense, and netCashflow are the account base
        currency (named by currency); transactionCount spans every currency; currencies lists each group, sorted by
        code, and is empty when nothing is eligible.
      allOf:
        - $ref: '#/components/schemas/CurrencyTotals'
        - type: object
          required: [currencies]
          properties:
            currencies: { type: array, items: { $ref: '#/components/schemas/CurrencyTotals' } }
    DashboardOverview:
      description: >-
        Existing overview fields plus additive currency, currencies, periodStart, periodEnd, and timeZone. month is a user month
        (timezone and month-start day). savingRate is base-currency net / income x 100 rounded half up to a whole
        percent, 0 without income.
      allOf:
        - $ref: '#/components/schemas/TotalsSummary'
        - type: object
          required: [month, savingRate, unreadAlerts, periodStart, periodEnd, timeZone]
          properties:
            month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
            savingRate: { type: integer }
            unreadAlerts: { type: integer }
            periodStart: { type: string, format: date-time }
            periodEnd: { type: string, format: date-time, description: Exclusive }
            timeZone: { type: string, description: 'Additive; the account IANA zone the period uses, so clients format dates without another request' }
    CashflowMonth:
      type: object
      required: [month, currency, income, expense, netCashflow]
      properties:
        month: { type: string }
        currency: { type: string, description: Additive; the base currency }
        income: { type: number }
        expense: { type: number }
        netCashflow: { type: number }
    CategoryBreakdownRow:
      type: object
      required: [categoryId, category, currency, amount, count]
      properties:
        categoryId: { type: [string, 'null'], description: null groups uncategorized records }
        category: { type: [object, 'null'], description: 'The category. Categories flagged excludeFromAnalytics never appear in a breakdown' }
        currency: { type: string, description: Additive }
        amount: { type: number }
        count: { type: integer }

  responses:
    Unauthorized: { description: 'Missing, expired, or invalid session', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Authenticated but insufficient role, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    OwnerSafeNotFound: { description: 'Absent, not owned, or malformed id (non-disclosing; administrators get the same outcome for private resources). A URL containing an encoded NUL (%00) gets this 404 before authentication; an id with undecodable percent-encoding (for example %FF) gets 400 before authentication instead', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    ValidationError: { description: Field-level validation failure, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    HttpsRequired: { description: 'Production only (OPS-009): request not received over HTTPS via the trusted proxy; code HTTPS_REQUIRED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    EmptyOk:
      description: Enveloped success with no specific payload
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }

security:
  - cookieAuth: []
paths:
  /health/live:
    get:
      security: []
      responses:
        '200':
          description: Process is alive (enveloped by the global interceptor; probes check status code only)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { type: object, properties: { status: { const: ok } } } }
  /health/ready:
    get:
      security: []
      responses:
        '200':
          description: Required dependencies are ready
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { type: object, properties: { status: { const: ready }, database: { const: up } } } }
        '503': { description: Not ready, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/register:
    post:
      security: []
      summary: Public registration; body has no role/status and always creates USER
      responses:
        '201': { $ref: '#/components/responses/EmptyOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/HttpsRequired' }
  /auth/login:
    post:
      security: []
      summary: Existing; production sets Secure; HttpOnly; SameSite=Lax cookies and refuses non-HTTPS
      responses:
        '200': { description: Authenticated session (enveloped), content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/HttpsRequired' }
  /auth/refresh:
    post:
      security: []
      summary: >-
        Existing; single-use rotation: of concurrent requests replaying one refresh token exactly one succeeds.
        Disabled, pending-deletion, and soft-deleted accounts get 401.
      responses:
        '200': { description: Rotated authenticated session, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/HttpsRequired' }
  /auth/logout:
    post:
      security: []
      summary: Existing; production refuses non-HTTPS (OPS-009)
      responses:
        '200': { $ref: '#/components/responses/EmptyOk' }
        '403': { $ref: '#/components/responses/HttpsRequired' }
  /email-connections/gmail/connect:
    post:
      summary: >-
        Existing; returns the Google authorization URL. It also sets the HttpOnly, SameSite=Lax cookie gmailOAuthNonce
        (path /api/email-connections/gmail/callback, 10 minutes), whose hash the signed state carries (SEC-001).
      responses:
        '201': { description: 'Enveloped { authorizationUrl }' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /email-connections/gmail/callback:
    get:
      security: []
      summary: >-
        Existing OAuth redirect target (<origin>/api/email-connections/gmail/callback); production refuses non-HTTPS.
        The state must be valid, unexpired, and bound to the browser that started the flow (gmailOAuthNonce cookie),
        and the account must be active; this is checked before Google is called. The nonce cookie is cleared on every
        callback that reaches the handler; a callback refused earlier (HTTPS_REQUIRED) leaves it to expire after
        10 minutes.
      responses:
        '200': { description: 'Current (as built in US1): the enveloped connection record of the calling user (id, provider, mailbox address, scopes, status, timestamps; no tokens)' }
        '302': { description: 'Target, not yet implemented: redirect back to the web app with a sanitized connection outcome' }
        '401': { description: 'Missing, invalid, expired, or unbound state, or an inactive account; nothing is linked', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/HttpsRequired' }
  /users/me/settings:
    patch:
      summary: Existing self-service settings; storeRawEmailBody can only be false (DATA-001)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/UserSettingsWrite' } } } }
      responses:
        '200':
          description: >-
            The updated user view (enveloped), as GET /users/me returns it; its settings object carries the
            UserSettingsView fields.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { type: object, properties: { settings: { $ref: '#/components/schemas/UserSettingsView' } } } }
        '400': { description: 'Validation error, or code RAW_EMAIL_BODY_UNAVAILABLE with fields.storeRawEmailBody for storeRawEmailBody true; nothing is stored', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /users/me:
    patch:
      summary: Self-service profile update of the caller's own account (audited field names only)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/UserProfileWrite' } } } }
      responses:
        '200': { description: The caller's own profile including settings (enveloped), content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/list:
    post:
      summary: Administrator lists accounts (existing list query body); items are AdminUserView
      responses:
        '201': { description: 'Enveloped { data: AdminUserView[], total } (existing POST status code)', content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users:
    post:
      summary: Administrator creates a managed account (no network path grants ADMIN to a non-admin caller)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserWrite' } } } }
      responses:
        '201':
          description: Created account (enveloped AdminUserView)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/AdminUserView' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: Administrator reads account identity/status only
      responses:
        '200':
          description: Account identity and status (enveloped AdminUserView; no settings)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/AdminUserView' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Absent, soft-deleted, or malformed id (administrators only; non-administrators get 403 for any id) }
    patch:
      summary: Administrator updates identity/role/status (audited)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserWrite' } } } }
      responses:
        '200':
          description: Updated account (enveloped AdminUserView)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/AdminUserView' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      summary: Administrator soft-deletes an account (audited); its sessions stop working
      responses:
        '200': { description: 'Enveloped { id }' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /bank-providers:
    get:
      summary: >-
        Existing read of the seeded supported providers (any authenticated user). No write operation exists in this
        release; POST/PATCH/DELETE are unsupported routes (404) until an administrator-only write is introduced (SEC-003).
      responses:
        '200': { description: Enveloped provider list }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /parser-templates:
    post:
      summary: Administrator creates a global parser template (SEC-003); reads (GET) stay available to authenticated users
      responses:
        '201': { description: Created template (enveloped) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /parser-templates/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    patch:
      summary: Administrator updates a global parser template (SEC-003)
      responses:
        '200': { description: Updated template (enveloped) }
        '403': { $ref: '#/components/responses/Forbidden' }
  /transactions:
    get:
      summary: >-
        Existing owner list (never soft-deleted rows) plus additive totals: the eligible totals of every row matching the
        same filters, not only the page. With the same month and no other filter they equal the dashboard overview.
      parameters:
        - { in: query, name: month, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }, description: 'Additive; a user month. Cannot be combined with from/to (400)' }
        - { in: query, name: from, schema: { type: string, format: date-time }, description: 'Inclusive; needs a UTC offset; must not be after to' }
        - { in: query, name: to, schema: { type: string, format: date-time }, description: 'Inclusive; needs a UTC offset' }
        - { in: query, name: search, schema: { type: string, maxLength: 200 } }
      responses:
        '200':
          description: 'Enveloped { data, total, page, limit, totals }'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          data: { type: array, items: { type: object } }
                          total: { type: integer }
                          page: { type: integer }
                          limit: { type: integer }
                          totals: { $ref: '#/components/schemas/TotalsSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      summary: Existing owner create; body rules in TransactionWriteRules
      responses:
        '201': { description: Created transaction (enveloped) }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/OwnerSafeNotFound' }
  /dashboard/overview:
    get:
      summary: Existing monthly overview over eligible persisted records (DASH-001, DASH-002)
      parameters:
        - { in: query, name: month, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }, description: 'User month; default the one containing now; malformed gets 400' }
      responses:
        '200':
          description: Overview (enveloped)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/DashboardOverview' } }
        '400': { $ref: '#/components/responses/ValidationError' }
  /dashboard/cashflow:
    get:
      summary: Existing trend, now one zero-filled entry per user month, oldest first, in the base currency
      parameters:
        - { in: query, name: months, schema: { type: integer, minimum: 1, maximum: 24, default: 6 } }
        - { in: query, name: month, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }, description: 'Additive; the last month of the trend; default the one containing now' }
      responses:
        '200':
          description: Trend (enveloped)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/CashflowMonth' } } }
  /dashboard/category-breakdown:
    get:
      summary: >-
        Existing breakdown of eligible expense per category and currency, uncategorized included and not truncated;
        base-currency rows first, then by amount. Categories flagged excludeFromAnalytics never appear, although their
        transactions still count in the overview expense, trends, and list totals; the rows of one currency therefore add
        up to that expense minus the excluded categories (equal when none has spending). The
        recent-transactions, hot-budgets (additive currency; spend in the budget currency), insights, and analytics
        routes take the same month parameter and policy; analytics monthly-summary gains the TotalsSummary fields
        and analytics daily cashflow groups base-currency amounts by local date with an additive currency.
      parameters:
        - { in: query, name: month, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
      responses:
        '200':
          description: Breakdown (enveloped)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/CategoryBreakdownRow' } } }
  /transactions/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    patch:
      summary: Existing owner update; body rules in TransactionWriteRules (no DELETED status, no provenance fields)
      responses:
        '200': { description: Updated transaction (enveloped) }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/OwnerSafeNotFound' }
    delete:
      summary: Existing owner soft delete, the only way to set DELETED (audited TRANSACTION_DELETED)
      responses:
        '200': { description: 'Enveloped { id }' }
        '404': { $ref: '#/components/responses/OwnerSafeNotFound' }
  /email-connections/{id}/sync:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      summary: Run one bounded owner-triggered sync batch
      description: >-
        One page of at most 50 messages inside a 25-second run budget, under the connection's sync lease (EMAIL-005
        to EMAIL-007, EMAIL-013). Refusals come first and create no run: 404 (not the caller's connection), 503
        (reconnect required or token endpoint unavailable), 400 (no enabled listen rule), 409 (lease held). After
        the lease every outcome, including a provider failure, is a terminal run returned with 201.
      responses:
        '201':
          description: >-
            Terminal or continuable run result (enveloped). As built the endpoint answers 201 (the NestJS default for
            POST), not 200; clients must accept any 2xx.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/EmailSyncRun' } }
        '404': { $ref: '#/components/responses/OwnerSafeNotFound' }
        '400': { description: No enabled listen rule, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'A non-expired sync lease already exists; code SYNC_IN_PROGRESS', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'Reconnect required (code RECONNECT_REQUIRED; the connection becomes EXPIRED) or Google temporarily unavailable', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /email-connections:
    get:
      summary: The caller's connected (not disconnected) email connections
      responses:
        '200':
          description: Enveloped array
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/EmailConnectionView' } } }
  /email-connections/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    delete:
      summary: >-
        User disconnect (DATA-002): best-effort revocation at Google (the token goes in a form body), then the stored
        credentials and any sync lease are cleared whatever Google answered; status REVOKED. Derived transactions,
        messages, parser runs, and sync runs are kept. Connecting the same mailbox again reactivates the same
        connection and its sync progress.
      responses:
        '200': { description: Enveloped connection view }
        '404': { $ref: '#/components/responses/OwnerSafeNotFound' }
  /email-messages/{id}/parse:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      summary: >-
        Parse one owned message again from its stored metadata (legacy rows may still carry a snippet). The raw body is
        never stored, so a message with neither is refused with 409 EMAIL_BODY_UNAVAILABLE and nothing is recorded.
      responses:
        '201':
          description: Enveloped ParseOutcome
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/ParseOutcome' } }
        '404': { $ref: '#/components/responses/OwnerSafeNotFound' }
        '409': { description: 'No stored body and none supplied; code EMAIL_BODY_UNAVAILABLE', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /email-connections/{id}/sync-runs:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      responses:
        '200':
          description: Owner-visible sync runs, newest first (enveloped)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/EmailSyncRun' } } }
        '404': { $ref: '#/components/responses/OwnerSafeNotFound' }
  /transactions/{id}/category:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    patch:
      summary: Apply authoritative manual category correction
      description: >-
        TX-004, CLASS-005: the category (or null to clear it) becomes a MANUAL decision that automatic runs never
        overwrite. The row is locked, updated, and given a MANUAL_CORRECTION event in one database transaction; the
        audit TRANSACTION_CATEGORY_CORRECTED is written when the category changes. Repeating the current manual
        choice writes nothing (decision.eventId null). categoryId is required (an empty body gets 400).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId]
              properties:
                categoryId: { type: [string, 'null'], minLength: 1 }
      responses:
        '200':
          description: The updated transaction with the decision (enveloped)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/ClassificationProvenance'
                          - type: object
                            properties:
                              decision:
                                type: object
                                required: [source, reason, eventId]
                                properties:
                                  source: { const: MANUAL }
                                  reason: { enum: [MANUAL_SET, MANUAL_CLEARED] }
                                  eventId: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/OwnerSafeNotFound' }
  /transactions/{id}/reclassify:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      summary: Explicit deterministic reclassification, releasing a manual category
      description: >-
        CLASS-006: applies the current rules to the transaction's current facts and replaces a MANUAL category
        (clients must warn first). Always appends an EXPLICIT_RECLASSIFY event and the audit TRANSACTION_RECLASSIFIED,
        even when the outcome is unchanged. The body must be empty (any property gets 400). Answers 200.
      requestBody:
        content: { application/json: { schema: { type: object, additionalProperties: false } } }
      responses:
        '200':
          description: The updated transaction with the decision (enveloped)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/ClassificationProvenance'
                          - type: object
                            properties:
                              decision:
                                type: object
                                required: [source, categoryId, ruleId, reason, explanation, eventId]
                                properties:
                                  source: { enum: [USER_RULE, SYSTEM_RULE, FALLBACK] }
                                  categoryId: { type: [string, 'null'] }
                                  ruleId: { type: [string, 'null'] }
                                  reason: { enum: [RULE_MATCHED, NO_RULE_MATCHED] }
                                  explanation: { $ref: '#/components/schemas/DecisionExplanation' }
                                  eventId: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/OwnerSafeNotFound' }
  /transactions/{id}/category-history:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: The owner's append-only category history, oldest first
      description: >-
        Rows created before DB-M3 have no events (no history is backfilled). A soft-deleted transaction gets 404; its
        events are kept.
      responses:
        '200':
          description: Enveloped array of CategoryEvent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/CategoryEvent' } } }
        '404': { $ref: '#/components/responses/OwnerSafeNotFound' }
  /classification-rules:
    get:
      summary: The caller's rules and the active system rules (read-only), by priority
      responses:
        '200':
          description: Enveloped array
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/ClassificationRule' } } }
    post:
      summary: Create a user rule (system rules have no HTTP route)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClassificationRuleWrite' } } } }
      responses:
        '201':
          description: Enveloped rule
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/ClassificationRule' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: 'Category absent, archived, or not usable by the caller: "Transaction category not found"', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /classification-rules/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    patch:
      summary: Change one of the caller's rules (a system rule or another owner's rule is 404)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClassificationRuleWrite' } } } }
      responses:
        '200':
          description: Enveloped rule
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/ClassificationRule' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/OwnerSafeNotFound' }
    delete:
      summary: Delete one of the caller's rules; transactions it decided keep their category
      responses:
        '200': { description: 'Enveloped { id }' }
        '404': { $ref: '#/components/responses/OwnerSafeNotFound' }
  /budgets:
    get:
      summary: Existing list; each item carries the additive threshold/support fields
      responses:
        '200':
          description: Owner budgets (enveloped; existing pagination/usage fields retained)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/BudgetThresholdView' } } }
    post:
      summary: Create budget (thresholdPercent 1-99 warning; critical fixed 100)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/BudgetWrite' } } } }
      responses:
        '201': { $ref: '#/components/responses/EmptyOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /budgets/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: Existing read; carries the additive threshold/support fields
      responses:
        '200':
          description: Owned budget (enveloped)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/BudgetThresholdView' } }
        '404': { $ref: '#/components/responses/OwnerSafeNotFound' }
    patch:
      summary: Update budget; triggers budget alert evaluation (ALERT-009)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/BudgetWrite' } } } }
      responses:
        '200': { $ref: '#/components/responses/EmptyOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/OwnerSafeNotFound' }
  /budgets/alerts:
    get:
      summary: Existing read-only near-threshold projection; uses the shared threshold function and never writes alerts
      responses:
        '200': { description: Projection (enveloped), content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /budgets/{id}/recalculate:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      responses:
        '200': { description: Current usage and alert condition changes (enveloped), content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '404': { $ref: '#/components/responses/OwnerSafeNotFound' }
  /alerts:
    get:
      parameters:
        - { in: query, name: status, schema: { enum: [ACTIVE, DISMISSED, RESOLVED] } }
        - { in: query, name: isRead, schema: { type: boolean } }
      responses:
        '200':
          description: Owner alerts (enveloped; existing pagination fields retained)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Alert' } } } } }
    post:
      summary: Existing user-authored alert; conditionKey null, never evaluated/resolved, in-app only with no delivery row (retention pending decision)
      responses:
        '201': { $ref: '#/components/responses/EmptyOk' }
  /alerts/unread-count:
    get:
      responses:
        '200':
          description: Count of the user's alerts with isRead=false
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { type: object, required: [count], properties: { count: { type: integer, minimum: 0 } } } }
  /alerts/{id}/read:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    patch:
      summary: Existing; changes only isRead/readAt, never status
      responses:
        '200': { $ref: '#/components/responses/EmptyOk' }
        '404': { $ref: '#/components/responses/OwnerSafeNotFound' }
  /alerts/read-all:
    patch:
      summary: Existing; changes only isRead/readAt
      responses:
        '200': { $ref: '#/components/responses/EmptyOk' }
  /alerts/{id}/dismiss:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    patch:
      summary: ACTIVE -> DISMISSED; sets dismissedAt and marks read; RESOLVED alerts return 409
      responses:
        '200':
          description: Owned alert dismissed (enveloped)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/Alert' } }
        '404': { $ref: '#/components/responses/OwnerSafeNotFound' }
        '409': { description: Alert already resolved, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /alerts/settings:
    get:
      responses:
        '200':
          description: Per-type settings (enveloped)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/AlertSetting' } } }
    patch:
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/AlertSetting' } } } }
      responses:
        '200': { $ref: '#/components/responses/EmptyOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /goals/{id}/simulation:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: Side-effect free; never creates or resolves alerts
      responses:
        '200':
          description: Reproducible feasibility or insufficient-data result (enveloped)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/GoalFeasibility' } }
        '404': { $ref: '#/components/responses/OwnerSafeNotFound' }
