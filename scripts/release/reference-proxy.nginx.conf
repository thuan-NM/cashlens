# CashLens reference reverse proxy (T100; documented by T105). ILLUSTRATIVE.
#
# The proxy terminates TLS for ONE public origin and routes:
#   /api/  -> the API container, published on 127.0.0.1:${API_HOST_PORT} (default 3000)
#   /      -> the web container, published on 127.0.0.1:${WEB_HOST_PORT} (default 8080)
# so the browser only ever talks to https://<release-test-host> (same-origin
# cookies, relative /api in the web bundle; OPS-009, research.md "TLS boundary").
# Change the two upstream ports below if the env file overrides them.
#
# No certificate ships with this file. Replace every <...> placeholder:
#   <release-test-host>   the hostname in CORS_ORIGIN / APP_PUBLIC_URL
#   <certificate.pem>     certificate chain from the operator's CA or a local test CA
#   <private-key.pem>     its private key (never committed)
# Checked with `nginx -t` on nginx 1.24 (Ubuntu 24.04) and current stable.
# Hosts without IPv6 drop the `listen [::]:...` lines.
#
# TRUST_PROXY: the API trusts X-Forwarded-* only from the peer addresses in
# TRUST_PROXY. With this proxy on the host, the API sees the address Docker
# uses to forward published-port traffic into cashlens_net (often the pinned
# gateway 172.28.0.1, sometimes loopback). scripts/verify-release.ps1 reads
# the address the API actually logged and fails unless TRUST_PROXY covers it.

upstream cashlens_api {
  server 127.0.0.1:3000;
  keepalive 16;
}

upstream cashlens_web {
  server 127.0.0.1:8080;
  keepalive 16;
}

# Requests for any other host name are closed without an answer, so a forged
# Host header never reaches the application or a redirect.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name _;
  ssl_certificate     <certificate.pem>;
  ssl_certificate_key <private-key.pem>;
  return 444;
}

# Plain HTTP only redirects; nothing is served without TLS.
server {
  listen 80;
  listen [::]:80;
  server_name <release-test-host>;
  return 301 https://<release-test-host>$request_uri;
}

server {
  # `listen ... http2` works on nginx 1.24; newer versions only warn about it.
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name <release-test-host>;

  ssl_certificate     <certificate.pem>;
  ssl_certificate_key <private-key.pem>;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:cashlens_tls:10m;

  add_header Strict-Transport-Security "max-age=31536000" always;

  # Request bodies are small JSON documents; parser bodies are never uploaded.
  client_max_body_size 1m;

  # Headers every upstream receives. X-Forwarded-For is REPLACED with the
  # client address rather than appended, so a client cannot inject hops.
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host <release-test-host>;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host <release-test-host>;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;

  # The API keeps its /api prefix: no trailing slash on proxy_pass.
  location /api/ {
    proxy_pass http://cashlens_api;
    proxy_read_timeout 60s;
  }

  # A manual Gmail sync is one synchronous request of up to about a minute
  # (research.md "Response time"); the proxy must wait at least 90 s for it.
  location ~ ^/api/email-connections/[^/]+/sync$ {
    proxy_pass http://cashlens_api;
    proxy_read_timeout 90s;
  }

  location / {
    proxy_pass http://cashlens_web;
  }
}
